<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reference Links Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0e27;
            color: #00ff88;
            padding: 12px;
            transition: all 0.3s;
        }

        /* Cyberpunk theme colors */
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #1a1f3a;
            --bg-tertiary: #25304d;
            --text-primary: #00ff88;
            --text-secondary: #00ccff;
            --text-tertiary: #0099ff;
            --border-color: #ff006e;
            --border-color-dark: #00ff88;
            --accent: #ff006e;
            --accent-hover: #ff3385;
            --accent-alt: #00ffff;
            --accent-alt-hover: #00e5e5;
            --link-bg: #151b35;
            --link-bg-hover: #1f2847;
            --neon-pink: #ff006e;
            --neon-cyan: #00ffff;
            --neon-green: #00ff88;
        }

        .container {
            max-width: 100%;
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.95) 0%, rgba(26, 31, 58, 0.95) 100%);
            border: 2px solid var(--neon-pink);
            border-radius: 3px;
            padding: 12px;
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.3), inset 0 0 10px rgba(0, 255, 136, 0.1);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--neon-pink);
            padding-bottom: 8px;
            position: relative;
        }

        .header-row::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-cyan), var(--neon-pink));
            opacity: 0.5;
        }

        .header {
            font-size: 18px;
            font-weight: 700;
            color: var(--neon-pink);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px rgba(255, 0, 110, 0.5);
        }

        .theme-toggle {
            background: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            color: var(--bg-primary);
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 2px;
            transition: all 0.2s;
            font-weight: bold;
        }

        .theme-toggle:hover {
            background: var(--neon-pink);
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
            transform: scale(1.05);
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .category-btn {
            padding: 6px 12px;
            border: 2px solid var(--neon-green);
            border-radius: 0;
            background: var(--bg-secondary);
            color: var(--neon-green);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: 'Courier New', monospace;
        }

        .category-btn:hover {
            border-color: var(--neon-cyan);
            background: var(--link-bg-hover);
            color: var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-cyan);
        }

        .category-btn.active {
            background: var(--neon-pink);
            color: var(--bg-primary);
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px var(--neon-pink), inset 0 0 10px rgba(255, 0, 110, 0.3);
        }

        .links-section {
            display: none;
        }

        .links-section.active {
            display: block;
            animation: fadeIn 0.2s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .category-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--neon-cyan);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--neon-cyan);
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            padding-bottom: 6px;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .link-item {
            padding: 10px;
            background: linear-gradient(90deg, var(--link-bg) 0%, var(--bg-tertiary) 100%);
            border-left: 3px solid var(--neon-pink);
            border-top: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 0;
            text-decoration: none;
            color: var(--neon-green);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-weight: 500;
            font-family: 'Courier New', monospace;
        }

        .link-item:hover {
            background: linear-gradient(90deg, var(--link-bg-hover) 0%, var(--bg-tertiary) 100%);
            transform: translateX(3px);
            border-left-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.3), inset 0 0 8px rgba(0, 255, 255, 0.1);
        }

        .link-icon {
            font-size: 18px;
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-icon img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            border-radius: 3px;
        }

        .link-text {
            flex: 1;
            text-decoration: none;
            color: inherit;
        }

        .link-item:hover .link-text {
            text-decoration: underline;
        }

        .external-icon {
            opacity: 0.8;
            font-size: 11px;
            flex-shrink: 0;
            color: var(--neon-pink);
        }

        .link-item:hover .external-icon {
            color: var(--neon-cyan);
            animation: pulse 0.6s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        .no-links {
            text-align: center;
            padding: 20px;
            color: var(--text-tertiary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .edit-mode {
            margin-top: 16px;
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: 0;
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        .edit-btn, .save-btn, .cancel-btn {
            padding: 8px 14px;
            border: 2px solid;
            border-radius: 0;
            background: var(--bg-secondary);
            color: var(--neon-green);
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            font-family: 'Courier New', monospace;
            border-color: var(--neon-green);
        }

        .edit-btn:hover {
            background: var(--link-bg-hover);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .save-btn {
            background: var(--neon-pink);
            color: var(--bg-primary);
            border-color: var(--neon-pink);
        }

        .save-btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 15px var(--neon-pink);
        }

        .cancel-btn {
            background: var(--bg-secondary);
            margin-left: 8px;
            border-color: var(--neon-green);
            color: var(--neon-green);
        }

        .cancel-btn:hover {
            background: var(--link-bg-hover);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 8px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            border: 2px solid var(--neon-cyan);
            border-radius: 0;
            margin-bottom: 8px;
            resize: vertical;
            background: var(--bg-primary);
            color: var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2), inset 0 0 5px rgba(0, 255, 136, 0.1);
        }

        textarea::selection {
            background: var(--neon-pink);
            color: var(--bg-primary);
        }

        .info {
            font-size: 11px;
            color: var(--neon-cyan);
            margin-bottom: 8px;
            line-height: 1.5;
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        .info code {
            background: var(--bg-primary);
            color: var(--neon-green);
            padding: 2px 6px;
            border: 1px solid var(--neon-green);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-row">
            <div class="header">📚 Reference Links</div>
            <button class="theme-toggle" id="themeToggle" title="Toggle dark mode">🌙</button>
        </div>

        <div class="categories" id="categoryButtons"></div>

        <div id="linksContainer"></div>

        <div class="edit-mode">
            <button class="edit-btn" id="editBtn">✏️ Edit Links</button>
            <div id="editPanel" style="display: none; margin-top: 8px;">
                <div class="info">
                    <strong>Format:</strong> <code>category: icon_or_image link_text | https://url</code><br>
                    <strong>Emoji icons:</strong> <code>Docs: 📖 Matrix Spec | https://spec.matrix.org</code><br>
                    <strong>Image icons:</strong> <code>Docs: https://example.com/logo.png Matrix Spec | https://spec.matrix.org</code><br>
                    Use emoji, single character, or full image URL as icon. One link per line.
                </div>
                <textarea id="linksData" placeholder="Documentation: 📖 Matrix Spec | https://spec.matrix.org
Documentation: https://matrix.org/_matrix/media/r0/download/matrix.org/ascERGshawAWawugaAcauga Element Help | https://element.io/help"></textarea>
                <button class="save-btn" id="saveBtn">💾 Save</button>
                <button class="cancel-btn" id="cancelBtn">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_LINKS = `Documentation: 📖 Matrix Spec | https://spec.matrix.org
Documentation: 📚 Element Help | https://element.io/help
Community: 💬 Matrix Chat Room | https://matrix.to/#/#matrix:matrix.org
Community: 👥 Matrix Forums | https://github.com/matrix-org
Resources: ⚙️ Synapse Server | https://github.com/matrix-org/synapse
Resources: 🌐 Element Web | https://github.com/element-hq/element-web`;

        // Helper to check if string is a URL
        function isImageUrl(str) {
            return str.startsWith('http://') || str.startsWith('https://');
        }

        let currentCategory = null;
        let linksData = {};

        // Initialize dark mode from localStorage
        function initDarkMode() {
            const isDarkMode = localStorage.getItem('matrixWidgetDarkMode') === 'true';
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
                updateThemeToggle();
            }
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDarkMode = document.body.classList.contains('dark-mode');
            localStorage.setItem('matrixWidgetDarkMode', isDarkMode);
            updateThemeToggle();
        }

        function updateThemeToggle() {
            const isDarkMode = document.body.classList.contains('dark-mode');
            document.getElementById('themeToggle').textContent = isDarkMode ? '☀️' : '🌙';
        }

        function parseLinks(text) {
            const result = {};
            const lines = text.trim().split('\n');

            for (const line of lines) {
                if (!line.trim()) continue;

                // Match: category: icon text | url
                // Icon can be emoji or any character(s)
                const match = line.match(/^([^:]+):\s*(\S+)\s+(.+?)\s*\|\s*(.+)$/);
                if (match) {
                    const [, category, icon, text, url] = match;
                    const catKey = category.trim();
                    
                    if (!result[catKey]) {
                        result[catKey] = [];
                    }

                    result[catKey].push({
                        icon: icon.trim(),
                        text: text.trim(),
                        url: url.trim(),
                        isImageIcon: isImageUrl(icon.trim())
                    });
                }
            }

            return result;
        }

        function renderLinks() {
            // Parse data from localStorage or use default
            const stored = localStorage.getItem('matrixLinksData');
            const dataText = stored || DEFAULT_LINKS;
            linksData = parseLinks(dataText);

            // Render category buttons
            const categoryButtons = document.getElementById('categoryButtons');
            categoryButtons.innerHTML = '';

            const categories = Object.keys(linksData);
            if (categories.length === 0) {
                categoryButtons.innerHTML = '<div class="no-links">No links configured yet</div>';
                return;
            }

            categories.forEach(category => {
                const btn = document.createElement('button');
                btn.className = 'category-btn';
                btn.textContent = category;
                btn.onclick = () => selectCategory(category);
                categoryButtons.appendChild(btn);
            });

            // Select first category by default
            selectCategory(categories[0]);
        }

        function selectCategory(category) {
            currentCategory = category;

            // Update button styles
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === category);
            });

            // Render links
            const container = document.getElementById('linksContainer');
            container.innerHTML = '';

            const links = linksData[category] || [];
            const section = document.createElement('div');
            section.className = 'links-section active';

            const title = document.createElement('div');
            title.className = 'category-title';
            title.textContent = category;
            section.appendChild(title);

            if (links.length === 0) {
                const noLinks = document.createElement('div');
                noLinks.className = 'no-links';
                noLinks.textContent = 'No links in this category';
                section.appendChild(noLinks);
            } else {
                const linksList = document.createElement('div');
                linksList.className = 'links-list';

                links.forEach(link => {
                    const linkItem = document.createElement('a');
                    linkItem.className = 'link-item';
                    linkItem.href = link.url;
                    linkItem.target = '_blank';
                    linkItem.rel = 'noopener noreferrer';
                    
                    // Create icon element
                    const iconSpan = document.createElement('span');
                    iconSpan.className = 'link-icon';
                    
                    if (link.isImageIcon) {
                        const img = document.createElement('img');
                        img.src = link.icon;
                        img.alt = link.text;
                        img.onerror = () => {
                            // Fallback to text if image fails to load
                            img.style.display = 'none';
                            iconSpan.textContent = '🔗';
                        };
                        iconSpan.appendChild(img);
                    } else {
                        iconSpan.textContent = link.icon;
                    }
                    
                    linkItem.appendChild(iconSpan);
                    
                    const textSpan = document.createElement('span');
                    textSpan.className = 'link-text';
                    textSpan.textContent = link.text;
                    linkItem.appendChild(textSpan);
                    
                    const externalSpan = document.createElement('span');
                    externalSpan.className = 'external-icon';
                    externalSpan.textContent = '↗';
                    linkItem.appendChild(externalSpan);
                    
                    linksList.appendChild(linkItem);
                });

                section.appendChild(linksList);
            }

            container.appendChild(section);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Edit functionality
        document.getElementById('editBtn').addEventListener('click', () => {
            const editPanel = document.getElementById('editPanel');
            const linksDataField = document.getElementById('linksData');
            editPanel.style.display = editPanel.style.display === 'none' ? 'block' : 'none';
            
            if (editPanel.style.display === 'block') {
                linksDataField.value = localStorage.getItem('matrixLinksData') || DEFAULT_LINKS;
                linksDataField.focus();
            }
        });

        document.getElementById('saveBtn').addEventListener('click', () => {
            const newData = document.getElementById('linksData').value;
            localStorage.setItem('matrixLinksData', newData);
            document.getElementById('editPanel').style.display = 'none';
            renderLinks();
        });

        document.getElementById('cancelBtn').addEventListener('click', () => {
            document.getElementById('editPanel').style.display = 'none';
        });

        document.getElementById('themeToggle').addEventListener('click', toggleDarkMode);

        // Initial setup
        initDarkMode();
        renderLinks();
    </script>
</body>
</html>
